services:
  icloud-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_HUB_MIRROR: ${DOCKER_HUB_MIRROR:-docker.io}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-dl-cdn.alpinelinux.org}
    image: icloud-api:local
    pull_policy: build

  postgres:
    build:
      context: .
      dockerfile: Dockerfile
      target: postgres-runtime
      args:
        DOCKER_HUB_MIRROR: ${DOCKER_HUB_MIRROR:-docker.io}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-dl-cdn.alpinelinux.org}
    image: icloud-api-postgres:local
    pull_policy: build
